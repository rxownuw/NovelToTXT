name: Build BlogToTXT Novel APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'BlogToTXT-Novel-Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: unzip -q BlogToTXT-Novel-Project.zip

      - name: Install dependencies
        working-directory: BlogToTXT-Android
        run: npm install

      - name: Build web assets
        working-directory: BlogToTXT-Android
        run: npm run build

      - name: Add Android platform
        working-directory: BlogToTXT-Android
        run: npx cap add android

      - name: Configure Android and register Download plugin
        working-directory: BlogToTXT-Android
        run: |
          python3 scripts/install-download-plugin.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          p.write_text(s)
          PY
          npx cap sync android

      - name: Build debug APK
        working-directory: BlogToTXT-Android/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlogToTXT-Novel-APK
          path: BlogToTXT-Android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
